<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unsigned DSL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.20/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.20/theme/dracula.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.20/codemirror.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.20/addon/hint/show-hint.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.20/addon/hint/show-hint.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.20/addon/dialog/dialog.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.20/addon/dialog/dialog.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.20/addon/search/searchcursor.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.20/addon/search/search.min.js"></script>
<style>
	:root{
		--bg:            #0b0f14;
		--panel:         #10151c;
		--panel-edge:    #1c2531;
		--ink:           #d8e2ea;
		--ink-dim:       #6b7f92;
		--diamond:       #55d6ee;
		--diamond-dim:   #1f4a55;
		--amber:         #f0a63c;
		--err:           #ff6b6b;
		--ok:            #6bdc8f;
		--mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
		--disp: 'Space Grotesk', var(--mono);
	}
	*{box-sizing:border-box;}
	html,body{height:100%;}
	body{
		margin:0;
		background: var(--bg);
		color:var(--ink);
		font-family:var(--mono);
		display:flex;
		flex-direction:column;
		height:100vh;
		overflow:hidden;
	}

	body, textarea {
		font-variant-ligatures: none;
	}

	header{
		padding:6px 14px;
		border-bottom:1px solid var(--panel-edge);
	}
	header .mark{
		font-size:15px;
	}

	#aiPromptBtn {
		margin-left: 50px;
	}

	main{
		flex:1;
		min-height:0;
		display:grid;
		grid-template-columns:2.5fr 1fr;
		gap:2px;
		padding:10px;
	}

	.pane{
		display:flex;
		flex-direction:column;
		min-height:0;
		min-width:0;
	}
	.pane .pane-head{
		padding:4px 10px 6px;
		display:flex;
		align-items:center;
		justify-content:space-between;
	}
	
	.flowbtn{
		padding:6px 8px;
		border:1px solid var(--diamond);
		border-radius:6px;
		background:var(--panel);
		color:var(--diamond);
		cursor:pointer;
		font:inherit;
	}
	.flowbtn:hover{
		background:rgba(85,214,238,.15);
		border-color:var(--diamond);
	}
	
	.flowbtn:active {
		background:rgba(85,214,238,.25);
		transform: scale(0.97);
	}

	.pane .pane-title{
		font-family:var(--disp);
		font-size:13px;
		font-weight:600;
		letter-spacing:0.1em;
		text-transform:uppercase;
		color:var(--ink-dim);
	}
	.pane .pane-title b{ color:var(--ink); }
	.pane textarea{
		flex:1;
		margin:0 10px 10px;
		background:var(--panel);
		border:1px solid var(--panel-edge);
		border-radius:8px;
		color:var(--ink);
		font-family:var(--mono);
		font-size:13px;
		line-height:1.6;
		padding:16px 18px;
		resize:none;
		white-space:pre;
		overflow:auto;
	}
	.pane textarea::placeholder{ color:#7d8c9a; }

	.log{
		margin:0 22px 20px;
		max-height:150px;
		overflow-y:auto;
		background:#0a0d12;
		border:1px solid var(--panel-edge);
		border-radius:8px;
		padding:10px 14px;
		font-size:12px;
		line-height:1.65;
		display:none;
	}
	.log.show{ display:block; }
	.log .line{ white-space:pre-wrap; word-break:break-word; }
	.log .line.err{ color:var(--err); }
	.log .line.ok{ color:var(--ok); }
	.log .line.info{ color:var(--ink-dim); }
	#bundleOutput{
		flex: 0 0 150px;
	}
	.CodeMirror{
		flex:1;
		margin:0 10px 10px;
		border:1px solid var(--panel-edge);
		border-radius:8px;
		font-family:var(--mono);
		font-size:13px;
		background:var(--panel);
		color:var(--ink);
		font-variant-ligatures: none;
		font-feature-settings: "liga" 0, "calt" 0;
	}

	.CodeMirror-hints{
		font-family: var(--mono);
		font-size: 13px;
		background: var(--panel);
		border: 1px solid var(--panel-edge);
		color: var(--ink);
	}
	.CodeMirror-hints li.CodeMirror-hint{
		color: var(--ink);
		background: transparent;
		padding: 4px 10px;
	}
	.CodeMirror-hints li.CodeMirror-hint-active,
	.CodeMirror-hints li.CodeMirror-hint-active.CodeMirror-hint{
		background: var(--diamond-dim);
		color: var(--diamond);
	}
	
	.cm-block {
		color: #ffffff;
	}

	.cm-action {
		color: #93d8c9;
	}

	.cm-target {
		color: #d1a3ee;
	}

	.cm-contents {
		color: #9dc0f9;
	}

	.cm-tags {
		color: #ffda9d;
	}

	.cm-separator {
		color: #c0c0c0;
	}

	.cm-error-line{
		background:rgba(255,0,0,.18);
	}

	.error-marker {
		color: #ff5555;
		cursor: help;
		font-size: 15px;
		font-weight: bold;
		text-align: center;
	}

	.CodeMirror-gutter.error-gutter {
		width: 18px;
	}
</style>
</head>
<body>

<header>
	<div class="mark">
		<span class="facet"></span>Unsigned DSL (Code ⇄ Template) v1.0.0
		<button class="flowbtn" id="aiPromptBtn">AI prompt .txt</button>
	</div>
</header>

<main>
	<section class="pane">
	<div class="pane-head">
		<div class="pane-title"><b>DSL code</b></div>
		<select class="pane-title" id="limitSizeSelect" style="color-scheme: dark; color: var(--ink);">
			<option value="50">Limit: Basic (50)</option>
			<option value="100">Limit: Large (100)</option>
			<option value="300" selected>Limit: Massive (300)</option>
		</select>
		<button class="flowbtn" id="downloadCodeBtn">Download .txt</button>
		<button class="flowbtn" id="toBundleBtn">To Item →</button>
	</div>
	<textarea id="codeInput" spellcheck="false" wrap="off">
event;Join;;;
	player_action;SendMessage;AllPlayers;[{"StyledText":"&lt;green&gt;%player joined the game!"}];
	start_process;myEndlessLoop;;;
	set_var;RandomNumber;;["line@randomgen",1,40];
	call_func;compressDiamonds;;["line@randomgen"];
	if_game;HasPlayer!;;["AI"];
		player_action;SendTitle;;["...",{"StyledText":"&lt;gradient:red:gold&gt;AI isnt playing for now"},50,0,20];

process;myEndlessLoop;;;
	repeat;Forever;;;
		control;Wait;;[1];{"Time Unit":"Seconds"}
		player_action;ActionBar;;["Normal string, %var(lastTs) last unix ts someone got diamonds"];
		set_var;StyledText;;["line@mySuffix",{"StyledText":"&lt;space&gt;&lt;green&gt;"},"g_val@Ping.Default","ms"];
		player_action;SetNamePrefix;;["line@mySuffix"];{"Text Type":"Suffix"}

func;compressDiamonds;;["*amount:num=1"];
	if_var;&lt;;;["line@amount",9];
		player_action;GiveItems;;[{"Item":"{count:1,id:diamond}"},"line@amount"];
	else;;;;
		set_var;/;;["line@blocks","line@amount",9];{"Division Mode":"Floor result"}
		set_var;%;;["line@diamonds","line@amount",9];
		player_action;GiveItems;;[{"Item":"{components:{custom_name:\"Example\"},count:1,id:diamond_block}"},"line@blocks"];
		player_action;GiveItems;;[{"Item":"{count:1,id:diamond}"},"line@diamonds"];
	player_action;PlaySound;;[{"Sound":["Lever Click",1.2,2]}];
	set_var;ShiftInDirection;;["line@fwdPos","g_val@Eye Location.Default",0.4];
	player_action;Particle;;[{"Particle":{"particle":"Happy Villager","cluster":{"amount":8,"horizontal":0.3,"vertical":0.1}}},"line@fwdPos"];
	set_var;RoundNumber;;["saved@lastTs","g_val@Timestamp.Default"];{"Round Mode":"Floor"}
</textarea>
	</section>

	<section class="pane">
	<div class="pane-head">
		<button class="flowbtn" id="toCodeBtn">← To Code</button>
		<button class="flowbtn" id="copyBundleBtn">Copy</button>
		<button class="flowbtn" id="codeclientBtn" title="Gives bundle of templates to Minecraft, if in creative">CodeClient</button>
		<div class="pane-title"><b>Template</b></div>
	</div>
		<textarea id="bundleOutput" spellcheck="false" wrap="off" placeholder="give @a cyan_bundle[bundle_contents=[...]]
To load from game:
Hold template or bundle, type
/i nbt (copy unformatted NBT), paste result"></textarea>
		<div class="log" id="bundleLog"></div>
	<div class="log" id="codeLog"></div>
	</section>
</main>

background:#1b1f2a;
color:#fff;
padding:6px 8px;
border:1px solid #ff5555;
border-radius:6px;
font-size:12px;
z-index:99999;
pointer-events:none;
white-space:pre-wrap;
"></div>

function shallowEqual(a, b) {
	const aKeys = Object.keys(a);
	const bKeys = Object.keys(b);
	return aKeys.length === bKeys.length && aKeys.every(k => b[k] === a[k]);
}

function isUpperChar(ch) {
	return typeof ch === "string" && ch.length === 1 && ch !== ch.toLowerCase() && ch === ch.toUpperCase();
}

function uint8ArrayToBase64(bytes) {
	let binary = "";
	const chunk = 0x8000;
	for (let i = 0; i < bytes.length; i += chunk) {
		binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
	}
	return btoa(binary);
}
function base64ToUint8Array(b64) {
	const binary = atob(b64);
	const bytes = new Uint8Array(binary.length);
	for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
	return bytes;
}

/* ====
	template to code
	==== */
function decodeTemplatedata(codestring) {
	const compressed = base64ToUint8Array(codestring);
	const decompressed = pako.inflate(compressed);
	const jsonText = new TextDecoder("utf-8").decode(decompressed);
	const codeJson = JSON.parse(jsonText);
	return codeJson.blocks;
}

function textifyItem(item) {
	if (item.id === "txt") {
		return item.data.name;
	} else if (item.id === "comp") {
		return { StyledText: item.data.name };
	} else if (item.id === "num") {
		const s = item.data.name;
		if (s.includes("%")) return { Num: s };
		return s.includes(".") ? parseFloat(s) : parseInt(s, 10);
	} else if (item.id === "loc") {
		const locdict = item.data.loc;
		const loclist = [locdict.x, locdict.y, locdict.z];
		if (locdict.pitch !== 0 || locdict.yaw !== 0) {
			loclist.push(locdict.pitch, locdict.yaw);
		}
		return { Location: loclist };
	} else if (item.id === "vec") {
		return { Vector: [item.data.x, item.data.y, item.data.z] };
	} else if (item.id === "snd") {
		return { Sound: [item.data.sound, item.data.pitch, item.data.vol, ...('variant' in item.data ? [item.data.variant] : [])] };
	} else if (item.id === "part") {
		return { Particle: item.data };
	} else if (item.id === "pot") {
		return { Potion: [item.data.pot, item.data.dur, item.data.amp] };
	} else if (item.id === "var") {
		return item.data.scope + "@" + item.data.name;
	} else if (item.id === "bucket_var") {
		return { Bucket: item.data };
	} else if (item.id === "g_val") {
		const targetsuffix = ("target" in item.data) ? "." + item.data.target : "";
		return item.id + "@" + item.data.type + targetsuffix;
	} else if (item.id === "pn_el") {
		const paramdata = item.data;
		const pluralplus = paramdata.plural ? "+" : "";
		const optionalstar = paramdata.optional ? "*" : "";
		const typesuffix = paramdata.type !== "any" ? ":" + paramdata.type : "";
		let defaultsuffix = "";
		if ("default_value" in paramdata) {
			let tempds = textifyItem(paramdata.default_value);
			if (tempds !== null && typeof tempds === "object") {
				tempds = JSON.stringify(tempds);
			}
			defaultsuffix = "=" + tempds;
		}
		return pluralplus + optionalstar + paramdata.name + typesuffix + defaultsuffix;
	} else if (item.id === "item") {
		let itemcleaned = item.data.item.replace(/"minecraft:([^"]+)"/g, "$1");
		itemcleaned = itemcleaned.replace(/DF_NBT:\d+,?/g, "");
		return { Item: itemcleaned };
	} else {
		return "???";
	}
}

const spaceFixer = txt => NEEDSPACEFIX.includes(txt.trim()) ? txt.trim() : txt;

function blockToLine(block) {
	const sl1 = block.block;
	let sl2 = "", sl2clean = "", sl3 = "", contents = "", tags = "";

	if ("action" in block) {
		const negatesuffix = (("attribute" in block) && !("subAction" in block)) ? "!" : "";
		sl2 = spaceFixer(block.action) + negatesuffix;
		sl2clean = spaceFixer(block.action);
	} else if ("data" in block) {
		sl2 = block.data;
		sl2clean = block.data;
	}

	if ("target" in block) {
		sl3 = block.target;
	} else if ("subAction" in block) {
		const negatesuffix = ("attribute" in block) ? "!" : "";
		sl3 = spaceFixer(block.subAction) + negatesuffix;
	}

	if ("args" in block && block.args && Array.isArray(block.args.items) && block.args.items.length) {
		const itemsNormal = [];
		const itemsTag = {};
		for (const item of block.args.items) {
			if (item.item.id === "bl_tag") {
				if (item.item.data.tag !== "Is Hidden" || item.item.data.option !== "False") {
					itemsTag[item.item.data.tag] = item.item.data.option;
				}
			} else if (item.item.id !== "hint") {
				itemsNormal.push(textifyItem(item.item));
			}
		}
		if (itemsNormal.length) {
			contents = JSON.stringify(itemsNormal);
		}
		if (Object.keys(itemsTag).length) {
			if (sl1 === "start_process" && shallowEqual(itemsTag, DEFAULTTAGS["start_process"])) {
				// matches default — omit
			} else if ((sl1 in DEFAULTTAGS) && DEFAULTTAGS[sl1] && (sl2clean in DEFAULTTAGS[sl1]) && shallowEqual(itemsTag, DEFAULTTAGS[sl1][sl2clean])) {
				// matches default — omit
			} else {
				tags = JSON.stringify(itemsTag);
			}
		}
	}
	return `${sl1};${sl2};${sl3};${contents};${tags}`;
}

function blocksToCode(blocks) {
	let indent = 0;
	const codelines = [];
	for (const block of blocks) {
		if (block.id === "bracket") {
			if (block.direct === "open") indent += 1;
			else if (block.direct === "close") indent -= 1;
		} else {
			const line = blockToLine(block);
			codelines.push("\t".repeat(Math.max(indent, 0)) + line);
			if (["game_event", "entity_event", "event", "func", "process"].includes(block.block)) {
				indent += 1;
			}
		}
	}
	return codelines;
}

/* ====
	code to template
	==== */
function encodeTemplatedata(blocks) {
	const codeBytes = new TextEncoder().encode(JSON.stringify({ blocks: blocks }));
	let compressed = pako.gzip(codeBytes, { level: 6, header: { time: 0 } });
	compressed = new Uint8Array(compressed);
	compressed[4] = 0; compressed[5] = 0; compressed[6] = 0; compressed[7] = 0; // mtime = 0
	compressed[8] = 0x00; // XFL
	compressed[9] = 0xFF; // OS
	const codeB64 = uint8ArrayToBase64(compressed);
	return JSON.stringify(codeB64);
}

function parseItem(value, sl1) {
	if (value !== null && typeof value === "object" && !Array.isArray(value)) {
		if ("StyledText" in value) return { id: "comp", data: { name: value.StyledText } };
		if ("Location" in value) {
			const loc = value.Location;
			const x = loc[0], y = loc[1], z = loc[2];
			const pitch = loc.length > 3 ? loc[3] : 0;
			const yaw = loc.length > 3 ? loc[4] : 0;
			if (![x, y, z, pitch, yaw].every(v => typeof v === "number")) {
				throw new Error("Location values must be numbers (not variables)");
			}
			return { id: "loc", data: { isBlock: false, loc: { x, y, z, pitch, yaw } } };
		}
		if ("Vector" in value) {
			const [x, y, z] = value.Vector;
			return { id: "vec", data: { x, y, z } };
		}
		if ("Sound" in value) {
			const [sound, pitch, vol, variant] = value.Sound;
			return { id: "snd", data: { pitch, vol, sound, ...(variant ? { variant } : {}) } };
		}
		if ("Particle" in value) return { id: "part", data: value.Particle };
		if ("Potion" in value) {
			const [pot, dur, amp] = value.Potion;
			return { id: "pot", data: { pot, dur, amp } };
		}
		if ("Bucket" in value) return { id: "bucket_var", data: value.Bucket };
		if ("Item" in value) return { id: "item", data: { item: value.Item } };
		if ("Num" in value) return { id: "num", data: { name: value.Num } };
		throw new Error("List-contents JSON contains unknown dict object type");
	}

	if (typeof value === "number") {
		return { id: "num", data: { name: String(value) } };
	}

	if (typeof value === "string") {
		if (value.startsWith("g_val@")) {
			const rest = value.slice("g_val@".length);
			if (rest.includes(".")) {
				if (rest.includes("%") || rest.includes("@")) {
					throw new Error(`Hardcoded variable g_val@ got invalid target field`);
				}
				const idx = rest.indexOf(".");
				if (!VALIDTARGETS.includes(rest.slice(idx + 1))) throw new Error("Invalid target type of g_val@")
				return { id: "g_val", data: { type: rest.slice(0, idx), target: rest.slice(idx + 1) } };
			}
			return { id: "g_val", data: { type: rest } };
		}

		if (value.includes("@") && !value.startsWith("@") && value.indexOf("@") < 9) {
			const idx = value.indexOf("@");
			const scope = value.slice(0, idx);
			const name = value.slice(idx + 1);
			if (!["line", "local", "unsaved", "saved", "g_val"].includes(scope)) {
				throw new Error(`Variable scope @ must be: line, local, unsaved, saved or g_val`);
			}
			if (name.includes("+") || name.includes("*") || name.includes("/")) {
				throw new Error(`Variables cant contain inline math`);
			}
			return { id: "var", data: { name: name, scope: scope } };
		}

		if (sl1 === "func" || sl1 === "process") {
			let v = value;
			const plural = v.startsWith("+");
			if (plural) v = v.slice(1);
			const optional = v.startsWith("*");
			if (optional) v = v.slice(1);

			const eqIdx = v.indexOf("=");
			if (!optional && eqIdx !== -1) {
				throw new Error("Only optional (* prefix) params can have defaults (= suffix)");
			}
			const left = eqIdx === -1 ? v : v.slice(0, eqIdx);
			const defaultRaw = eqIdx === -1 ? "" : v.slice(eqIdx + 1);

			const colonIdx = left.indexOf(":");
			const name = colonIdx === -1 ? left : left.slice(0, colonIdx);
			const typ = colonIdx === -1 ? "any" : left.slice(colonIdx + 1);
			if (!PARAMVARTYPES.includes(typ)) {
				throw new Error(`Unknown param type: ${typ}`);
			}

			const data = { name: name, type: typ };
			if (defaultRaw) {
				let defaultVal;
				try { defaultVal = JSON.parse(defaultRaw); } catch (e) { defaultVal = defaultRaw; }
				data.default_value = parseItem(defaultVal, "nonexistent");
			}
			data.plural = plural;
			data.optional = optional;
			return { id: "pn_el", data: data };
		}

		return { id: "txt", data: { name: value } };
	}

	throw new Error(`Unsupported value type for parse_item: ${JSON.stringify(value)}`);
}

const LETTER_PREFIX_DICT = { E: "if_entity", V: "if_var", P: "if_player", G: "if_game" };

function parseLine(line) {
	if (line.split(";").length === 6 && line.endsWith(";")) {
		line = line.slice(0, -1);
	}
	const parts = line.split(";");
	if (parts.length !== 5) {
		throw new Error("Every line must have four ;");
	}
	let [sl1, sl2, sl3, contents, tags] = parts;

	if (!VALIDCODEBLOCKS.includes(sl1)) {
		throw new Error(`Unknown codeblock type ${sl1}`);
	}

	if (contents) {
		try { JSON.parse(contents); } catch (e) { throw new Error("Invalid list-contents JSON"); }
		if (!Array.isArray(JSON.parse(contents))) throw new Error("List-contents JSON must be a list");
	}
	
	let specifiedTags = {};
	if (tags) {
		try { specifiedTags = JSON.parse(tags); } catch (e) { throw new Error("Invalid dict-tags JSON"); }
		if (Array.isArray(specifiedTags)) throw new Error("Dict-tags JSON must be a dictionary");
	}

	let negation = false;
	let isWhile = sl1 === "repeat" && (sl2 === "While" || sl2 === "DoWhile")

	if (sl2.endsWith("!")) { sl2 = sl2.slice(0, -1); negation = true; }
	if (sl1 === "select_obj" || isWhile) {
		if (sl3.endsWith("!")) { sl3 = sl3.slice(0, -1); negation = true; }
	} else {
		if (sl3 && !VALIDTARGETS.includes(sl3)) throw new Error("Invalid target type (field 3)")
	}
	
	const defaultTags = sl1 === "start_process"
		? DEFAULTTAGS["start_process"]
		: DEFAULTTAGS[sl1]?.[sl2];
	
	if (defaultTags) {
		const invalidKey = Object.keys(specifiedTags).find(key => !(key in defaultTags));
		if (invalidKey) throw new Error(`${sl1};${sl2} cant have tag '${invalidKey}'`);
		tags = JSON.stringify({ ...defaultTags, ...specifiedTags });
	}

	if (NEEDSPACEFIX.includes(sl3)) sl3 = " " + sl3 + " ";
	if (NEEDSPACEFIX.includes(sl2)) sl2 = " " + sl2 + " ";

	const block = { id: "block", block: sl1 };
	const items = [];

	if (contents) {
		let itemslot = 0;
		for (const value of JSON.parse(contents)) {
			items.push({ item: parseItem(value, sl1), slot: itemslot });
			itemslot++;
		}
	}

	if (tags) {
		const tagsObj = JSON.parse(tags);
		let itemslot = 27 - Object.keys(tagsObj).length;
		for (const [tagName, option] of Object.entries(tagsObj)) {
			let blockfield = sl1;
			let actionfield = ((sl1 === "select_obj" && (sl2 === "EntitiesCond" || sl2 === "PlayersCond")) || isWhile) ? sl3 : sl2;
			if (sl1 === "start_process") actionfield = "dynamic";

			if (sl1 === "select_obj" || isWhile) {
				if (actionfield.length >= 2 && isUpperChar(actionfield[1]) && isUpperChar(actionfield[0])) {
					if (!(actionfield[0] in LETTER_PREFIX_DICT)) {
						throw new Error(`KeyError: '${actionfield[0]}'`);
					}
					blockfield = LETTER_PREFIX_DICT[actionfield[0]];
				}
				fixactionfield = spaceFixer(actionfield);
				for (const search1 of ["if_var", "if_player", "if_entity", "if_game"]) {
					const bucket = DEFAULTTAGS[search1] || {};
					for (const searchsubblock of Object.keys(bucket)) {
						if (searchsubblock === fixactionfield) blockfield = search1;
					}
				}
			}

			items.push({ item: { id: "bl_tag", data: { option: option, tag: tagName, action: actionfield, block: blockfield } }, slot: itemslot });
			itemslot++;
		}
	}

	if (sl1 === "func") {
		items.push({ item: { id: "hint", data: { id: "function" } }, slot: 25 });
	}
	if ((sl1 === "func" || sl1 === "process") && !tags) {
		items.push({ item: { id: "bl_tag", data: { option: "False", tag: "Is Hidden", action: "dynamic", block: sl1 } }, slot: 26 });
	}

	if (sl1 !== "else") {
		block.args = { items: items };
	}

	if (sl2) {
		if (["call_func", "func", "start_process", "process"].includes(sl1)) {
			block.data = sl2;
		} else {
			block.action = sl2;
		}
	}

	if (sl3) {
		if (sl1 === "select_obj" || isWhile) {
			block.subAction = sl3;
		} else {
			block.target = sl3;
		}
	}

	if (negation) {
		block.attribute = (sl1 === "event") ? "LS-CANCEL" : "NOT";
	}

	return block;
}

function codeToBlocks(codelines) {
	const blocks = [];
	let prevIndent = 0;
	let prevBlockType = null;
	const bracketStack = [];
	let hadErrors = false;
	const errors = [];

	for (const rawLine of codelines) {
		if (!rawLine.trim()) continue;

		const normalized = rawLine.replace(/\t/g, "    ");
		const stripped = normalized.replace(/^ +/, "");
		const leading = normalized.length - stripped.length;
		const indent = Math.floor(leading / 4);

		if (indent > prevIndent) {
			const diff = indent - prevIndent;
			let emitDiff = diff;
			if (DEFINITIONBLOCKS.includes(prevBlockType)) emitDiff -= 1;
			if (!INDENTCAUSING.includes(prevBlockType)) {
				hadErrors = true;
				errors.push(`> Indent with invalid reason before line \`${stripped}\``);
			}
			const skip = diff - emitDiff;
			const bracketType = prevBlockType === "repeat" ? "repeat" : "norm";
			for (let i = 0; i < diff; i++) {
				if (i >= skip) {
					bracketStack.push(bracketType);
					blocks.push({ id: "bracket", direct: "open", type: bracketType });
				}
			}
		} else if (indent < prevIndent) {
			const diff = prevIndent - indent;
			for (let i = 0; i < diff; i++) {
				const bt = bracketStack.length ? bracketStack.pop() : "norm";
				blocks.push({ id: "bracket", direct: "close", type: bt });
			}
		} else if (INDENTCAUSING.includes(prevBlockType)) {
			hadErrors = true;
			errors.push(`> Missing indent at line \`${stripped}\` by \`${prevBlockType}\``);
		}

		let block;
		try {
			block = parseLine(stripped.trimEnd());
		} catch (e) {
			hadErrors = true;
			errors.push(`> Error at line \`${stripped}\`: ${e.message}`);
			continue;
		}
		blocks.push(block);

		prevIndent = indent;
		prevBlockType = block.block;
		if (indent === 0 && !DEFINITIONBLOCKS.includes(prevBlockType)) {
			hadErrors = true;
			errors.push(`> Cant have zero-indent level at line \`${stripped}\` by \`${prevBlockType}\``);
		}
	}

	if (hadErrors) return { blocks: [], errors: errors };

	while (bracketStack.length) {
		blocks.push({ id: "bracket", direct: "close", type: bracketStack.pop() });
	}

	return { blocks: blocks, errors: [] };
}

/* ====
	text code reading
	==== */
function textToMulticodelines(text) {
	const multicodelines = [];
	let codelines = [];
	const lines = text.split(/\r\n|\r|\n/);
	for (const line of lines) {
		const stripped = line.replace(/^[ \t]+/, "");
		if (!stripped || stripped.startsWith("#")) continue;
		if (line.length > 0 && /[A-Za-z]/.test(line[0])) {
			if (codelines.length) multicodelines.push(codelines);
			codelines = [];
		}
		codelines.push(line);
	}
	if (codelines.length) multicodelines.push(codelines);
	return multicodelines;
}

function multicodelinesToBundle(multicodelines) {
	const enderlist = [];
	let hadErrors = false;
	const allErrors = [];
	
	for (const codelines of multicodelines) {
		const { blocks: reconstrBlocks, errors } = codeToBlocks(codelines);
		if (!reconstrBlocks.length) {
			hadErrors = true;
			allErrors.push(...errors);
			continue;
		}
		try {
			const newtemplate = encodeTemplatedata(reconstrBlocks);
			const templength = reconstrBlocks.filter(b => !(b.id === "bracket" && b.direct === "close")).length;

			let quicktitle;
			if ("data" in reconstrBlocks[0]) quicktitle = reconstrBlocks[0].data;
			else if ("action" in reconstrBlocks[0]) quicktitle = reconstrBlocks[0].action;
			else throw new Error("first block has neither 'data' nor 'action'");

			if (templength * 2 > LIMITLINEBLOCKS) {
				hadErrors = true;
				allErrors.push(`Event/function/process "${quicktitle}" is too long (need ${LIMITLINEBLOCKS/2-templength} lines)`);
				continue;
			}

			const itemname = `(${templength * 2}) ${reconstrBlocks[0].block} \u00bb ${quicktitle}`;
			const endernbt = '{components:{custom_data:{PublicBukkitValues:{"hypercube:codetemplatedata":\'{"author":"AI","name":"' + itemname + '","version":1,"code":' + newtemplate + '}\'}},custom_name:{text:"' + itemname + '"}},count:1,id:ender_chest}';
			enderlist.push(endernbt);
		} catch (e) {
			hadErrors = true;
			allErrors.push(`Error building bundle item: ${e.message}`);
		}
	}

	if (hadErrors) return { error: true, errors: allErrors };

	const bundlecmd = `give @a cyan_bundle[bundle_contents=[${enderlist.join(",")}]]`;
	return { error: false, bundlecmd: bundlecmd };
}

/* ====
	Bundle → text (reverse of multicodelines_to_bundle)
	==== */
function bundleToText(bundleStr) {
	if (bundleStr.startsWith("H4")) {
		try {
			const blocks = decodeTemplatedata(bundleStr);
			return { text: blocksToCode(blocks).join("\n"), errors: [] };
		} catch (e) {
			return { text: "", errors: [`Error decoding string template: ${e.message}`] };
		}
	}
	if (bundleStr.startsWith('\'{"') && !bundleStr.includes("codetemplatedata")) {
		bundleStr = '"hypercube:codetemplatedata":'+bundleStr+'}}'
	}
	
	const regex = /"hypercube:codetemplatedata":'(\{.*?\})'\}\}/gs;
	const chunks = [];
	const errors = [];
	let count = 0;
	let match;
	while ((match = regex.exec(bundleStr)) !== null) {
		count++;
		try {
			const parsed = JSON.parse(match[1]);
			if (!("code" in parsed)) throw new Error(`missing "code" field`);
			const blocks = decodeTemplatedata(parsed.code);
			const codelines = blocksToCode(blocks);
			chunks.push(codelines.join("\n"));
		} catch (e) {
			errors.push(`> Error decoding item ${count}: ${e.message}`);
		}
	}
	if (count === 0) {
		errors.push("No codetemplatedata items found in input.");
	}
	return { text: chunks.join("\n\n"), errors: errors };
}

/* ====
	UI wiring
	==== */
CodeMirror.defineMode("signdsl", function() {
	return {
		startState() {
			return { field: 0 };
		},

		token(stream, state) {
			if (stream.sol()) {
				state.field = 0;
			}

			if (stream.peek() === ";") {
				stream.next();
				state.field++;
				return "separator";
			}

			while (!stream.eol() && stream.peek() !== ";") {
				stream.next();
			}

			switch (state.field) {
				case 0: return "block";
				case 1: return "action";
				case 2: return "target";
				case 3: return "contents";
				case 4: return "tags";
				default: return null;
			}
		}
	};
});
CodeMirror.registerHelper("hint", "signdsl", function(cm) {
	const cursor = cm.getCursor();
	const line = cm.getLine(cursor.line);
	const semiIdx = line.indexOf(";");
	const leadingLen = line.match(/^[\t ]*/)[0].length;
	
	const semis = (line.match(/;/g) || []).length;
	if (semis === 4 && cursor.ch === line.length && line.endsWith(";")) {
		const [command, subcommand] = line.slice(leadingLen).split(";");
		const tags = DEFAULTTAGS[command]?.[subcommand];
		if (tags) {
			return {
				list: [JSON.stringify(tags)],
				from: CodeMirror.Pos(cursor.line, cursor.ch),
				to: CodeMirror.Pos(cursor.line, cursor.ch)
			};
		}
	}
	
	let fieldStart = leadingLen;
	let fieldEnd = semiIdx === -1 ? line.length : semiIdx;
	let completions = VALIDCODEBLOCKS;
	
	if (semiIdx !== -1 && cursor.ch > semiIdx) {
		const block = line.slice(leadingLen, semiIdx).trim();
		completions = SUBCOMMANDBLOCKS[block];
		if (!completions) return null;

		fieldStart = semiIdx + 1;
		fieldEnd = line.length;
	}

	if (cursor.ch < fieldStart || cursor.ch > fieldEnd) return null;

	const word = line.slice(fieldStart, cursor.ch);
	const list = completions.filter(w => w.startsWith(word));
	if (!list.length) return null;

	return {
		list,
		from: CodeMirror.Pos(cursor.line, fieldStart),
		to: CodeMirror.Pos(cursor.line, fieldEnd)
	};
});

function markErrorLine(i, message) {
	codeMirror.addLineClass(i, "background", "cm-error-line");
	errorLines.push(i);

	const marker = document.createElement("div");
	marker.className = "error-marker";
	marker.textContent = "⚠";
	marker.addEventListener("mouseenter", (ev) => {

	});
	marker.addEventListener("mouseleave", hideTooltip);

	codeMirror.setGutterMarker(i, "error-gutter", marker);
}

function scanCode() {
	clearErrorLines();
	const lines = codeMirror.getValue().split(/\r?\n/);
	const definedNames = new Set();
	const funcNames = new Set();
	const processNames = new Set();

	lines.forEach((line, i) => {
		const stripped = line.replace(/^[ \t]+/, "");

		if (!stripped) return;
		if (stripped.startsWith("#")) return;

		try {
			parseLine(stripped.trimEnd());
		} catch (e) {
			markErrorLine(i, e.message);
			return;
		}
		const parts = stripped.trimEnd().split(";");
		const blockType = parts[0];
		if (DEFINITIONBLOCKS.includes(blockType)) {
			const key = blockType + ";" + parts[1];
			if (definedNames.has(key)) {
				markErrorLine(i, `Duplicate definition of ${parts[1]}`);
				return;
			}
			definedNames.add(key);
			if (blockType === "func" && parts[1]) funcNames.add(parts[1]);
			if (blockType === "process" && parts[1]) processNames.add(parts[1]);
		}
	});
	SUBCOMMANDBLOCKS["call_func"] = [...funcNames];
	SUBCOMMANDBLOCKS["start_process"] = [...processNames];
}


function logTo(el, lines) {
	el.innerHTML = "";
	if (!lines.length) { el.classList.remove("show"); return; }
	el.classList.add("show");
	for (const { text, kind } of lines) {
		const div = document.createElement("div");
		div.className = "line " + (kind || "info");
		div.textContent = text;
		el.appendChild(div);
	}
	el.scrollTop = el.scrollHeight;
}

document.getElementById("toBundleBtn").addEventListener("click", () => {
	const btn = document.getElementById("toBundleBtn");
	btn.classList.add("busy");
	setTimeout(() => {
		try {
			const multicodelines = textToMulticodelines(codeMirror.getValue());
			if (!multicodelines.length) {
				logTo(bundleLog, [{ text: "No code found — paste at least one block line (e.g. event;Join;;;).", kind: "err" }]);
				btn.classList.remove("busy");
				return;
			}
			const result = multicodelinesToBundle(multicodelines);
			if (result.error) {
				bundleOutput.value = "";
				logTo(bundleLog, result.errors.map(t => ({ text: t, kind: "err" })));
			} else {
				bundleOutput.value = result.bundlecmd;
				logTo(bundleLog, [{ text: `Built bundle with ${multicodelines.length} item${multicodelines.length === 1 ? "" : "s"}. (use singleplayer command block and creative saved hotbars)`, kind: "ok" }]);
			}
		} catch (e) {
			logTo(bundleLog, [{ text: `Unexpected error: ${e.message}`, kind: "err" }]);
		}
		btn.classList.remove("busy");
	}, 60);
});

document.getElementById("toCodeBtn").addEventListener("click", () => {
	const btn = document.getElementById("toCodeBtn");
	btn.classList.add("busy");
	setTimeout(() => {
	try {
		const { text, errors } = bundleToText(bundleOutput.value);
		const lines = errors.map(t => ({ text: t, kind: "err" }));
		if (text) {
			codeMirror.setValue(text);
			scanCode();
			lines.push({ text: `Decoded successfully.`, kind: "ok" });
		}
		logTo(codeLog, lines);
	} catch (e) {
		logTo(codeLog, [{ text: `Unexpected error: ${e.message}`, kind: "err" }]);
	}
	btn.classList.remove("busy");
	}, 60);
});

document.getElementById("copyBundleBtn").addEventListener("click", () => {
	navigator.clipboard.writeText(bundleOutput.value || "")
		.then(() => {
			logTo(codeLog, [{ text: "Copied to clipboard.", kind: "ok" }]);
		})
		.catch((e) => {
			logTo(codeLog, [{ text: "Copy failed: " + e.message, kind: "err" }]);
		});
});

document.getElementById("codeclientBtn").addEventListener("click", () => {
	if (!bundleOutput.value.startsWith("give @a cyan_bundle[bundle_contents=")) {
		logTo(codeLog, [{ text: "Can send only bundles", kind: "err" }]);
		return
	}
	clientcommand = bundleOutput.value.replace(
	  "give @a cyan_bundle[bundle_contents=",
	  "give {Count:1,id:cyan_bundle,components:{bundle_contents:"
	).slice(0, -1) + "}}";

	const ws = new WebSocket('ws://localhost:31375');
	ws.onopen = () => {
		ws.send(clientcommand);
		ws.onmessage = (event) => {logTo(codeLog, [{ text: event.data, kind: "info" }])};
		ws.close();
	}
	ws.onerror = () => {
		logTo(codeLog, [{ text: "Could not connect to CodeClient.", kind: "err" }]);
	}
});

function downloadTextFile(text, filename) {
	const blob = new Blob([text], { type: "text/plain" });
	const url = URL.createObjectURL(blob);

	const a = document.createElement("a");
	a.href = url;
	a.download = filename;
	a.click();

	URL.revokeObjectURL(url);
}

document.getElementById("downloadCodeBtn").addEventListener("click", () => {
	downloadTextFile(codeMirror.getValue(), "exportcode.txt");
});

document.getElementById("aiPromptBtn").addEventListener("click", () => {
	const compressed = base64ToUint8Array(PROMPTCOMPRESSED);
	const decompressed = pako.inflate(compressed);
	const text = new TextDecoder("utf-8").decode(decompressed);
	downloadTextFile(text, "dsl_docs.txt");
});

document.getElementById("limitSizeSelect").addEventListener("change", (ev) => {
    LIMITLINEBLOCKS = parseInt(ev.target.value, 10);
});

let scanTimer;

codeMirror.on("change", () => {
	clearTimeout(scanTimer);
	scanTimer = setTimeout(scanCode, 150);
});

codeMirror.on("inputRead", function(cm, change) {
	const cursor = cm.getCursor();
	const line = cm.getLine(cursor.line);
	const semiIdx = line.indexOf(";");
	const leadingLen = line.match(/^[\t ]*/)[0].length;

	let fieldStart = leadingLen;
	let fieldEnd = semiIdx === -1 ? line.length : semiIdx;

	if (semiIdx !== -1 && cursor.ch > semiIdx) {
		const block = line.slice(leadingLen, semiIdx).trim();
		if (!SUBCOMMANDBLOCKS[block]) return;

		fieldStart = semiIdx + 1;
		fieldEnd = line.length;
	}

	if (cursor.ch < fieldStart || cursor.ch > fieldEnd) return;
	if (!change.text) return;

	const ch = change.text[0];
	if (!/[A-Za-z_]/.test(ch) && ch !== ";") return;

	cm.showHint({ hint: CodeMirror.hint.signdsl, completeSingle: false });
});
